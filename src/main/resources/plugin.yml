name: CustomDeathMessages
version: '1.0.0'
main: com.customdeath.CustomDeathMessages
api-version: '1.20'
authors:
  - Agent Playground
description: 个性化死亡播报插件，替代原版死亡信息，支持自定义文案与颜色
softdepend:
  - Geyser-Spigot

commands:
  customdeath:
    description: 自定义死亡消息插件主命令
    usage: /cdm <reload|version|recipe|checkin|scroll|sin>
    aliases:
      - cdm

permissions:
  customdeath.reload:
    description: 允许重载插件配置
    default: op
  customdeath.scroll:
    description: 允许发放护身/回城/回溯卷轴
    default: op
  customdeath.sin:
    description: 允许查看/设置其他玩家的罪恶值（红名机制管理）
    default: op
  customdeath.checkin-reset:
    description: 允许重置其他玩家的每日签到状态（允许当天重新签到）
    default: op

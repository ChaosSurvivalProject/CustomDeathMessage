# ============================================================
#  CustomDeathMessages 配置文件
#  ----------------------------------------------------------
#  消息格式使用 MiniMessage 语法（Paper 官方推荐的现代格式），
#  支持颜色、渐变、粗体、斜体、下划线、点击动作等丰富样式。
#
#  常用颜色/样式标签：
#    <red> <gold> <green> <aqua> <blue> <dark_purple> <gray> <white>
#    <bold> <italic> <underlined> <strikethrough> <obfuscated> <reset>
#    <gradient:red:gold> 双色渐变
#    <gradient:#ff0000:#0000ff:red> 多色渐变（十六进制）
#    <rainbow> 彩虹渐变
#    <#FF5500> 任意十六进制颜色
#    <hover:show_text:'...'>...</hover> 悬停文本
#
#  可用占位符（在消息模板中直接书写）：
#    {player}  死亡玩家名（自动套用 player-name-color 颜色）
#    {killer}  击杀者名（自动套用 killer-name-color 颜色，无击杀者时为空）
#    {weapon}  击杀武器名（无武器时为空）
#    {damage}  造成死亡的最后一次伤害数值
#    {world}   死亡所在世界名
# ============================================================

settings:
  # 是否启用插件（false 时完全恢复原版死亡信息）
  enabled: true

  # 是否注册合成配方（护身卷轴 / 回城卷轴 / 回溯卷轴）
  # 关闭后配方从配方书中移除（已注册的服务器需重启才生效）
  recipes:
    enabled: true
    # 玩家登录时是否自动解锁配方到配方书
    # 开启后，玩家无需手动合成即可在配方书看到所有卷轴配方
    auto-discover: true
    # 玩家加入游戏后是否在聊天栏展示一次卷轴合成配方
    # 解决基岩版玩家（经 Geyser 连接）配方书不显示自定义配方的问题；
    # 开启后每次加入都会提示，玩家也可随时用 /customdeath recipe 查看
    join-hint-enabled: true

  # ============ 每日签到 ============
  # 玩家每天可通过 /customdeath checkin 签到领取卷轴奖励；
  # 同一天不可重复签到，跨天后（服务器 0 点）自动重置
  checkin:
    # 是否启用每日签到
    enabled: true
    # 签到奖励：三种卷轴各发放的数量（0 = 不发放该种）
    rewards:
      protect: 1
      town: 1
      recall: 1
    # 签到成功提示（{rewards} 会被替换为实际奖励列表，如「护身卷轴×1、回城卷轴×1、回溯卷轴×1」）
    success-message: "<green><bold>✔</bold> 签到成功！获得：{rewards}，明天 0 点后可再次签到</green>"
    # 当天重复签到提示
    already-message: "<red>你今天已经签到过了，明天 0 点后再来吧</red>"
    # 玩家进服时，若当天尚未签到，是否在聊天栏提示可领取（点击文本直接签到）
    join-hint-enabled: true
    # 进服提示文案（MiniMessage 语法，支持 <click:run_command:'/customdeath checkin'> 点击交互标签）
    join-hint-message: "<gray>[<yellow>CustomDeathMessage</yellow>]</gray> 今天的卷轴可领取，<gold><click:run_command:'/customdeath checkin'><underlined>点击进行领取</underlined></click></gold>"
    # 进服提示文案 - 基岩版玩家（经 Geyser 连接）：基岩端不支持聊天点击交互，提示手动输入指令（简写 /cdm checkin）
    join-hint-message-bedrock: "<gray>[<yellow>CustomDeathMessage</yellow>]</gray> 今天的卷轴可领取，输入 <gold>/cdm checkin</gold> 进行签到"

  # 死亡播报的广播范围：
  #   global - 全服所有玩家可见
  #   world  - 仅死亡玩家所在世界的玩家可见
  #   nearby - 仅死亡地点 nearby-radius 格范围内的玩家可见
  broadcast-mode: global

  # broadcast-mode 为 nearby 时的生效半径（单位：格）
  nearby-radius: 64

  # 同一条文案有多条时如何选择：
  #   random - 每次随机选一条
  #   cycle  - 按顺序轮流使用（保证所有文案都会被用到）
  message-selection: random

  # 是否在控制台输出原始英文死亡原因（便于排查与编写对应文案）
  console-log-reason: false

  # 是否在控制台打印最终播报的死亡消息（纯文本，无颜色标签）
  # 开启后控制台日志会输出类似：Steve 从高处跌落，摔成了肉饼
  console-log-death: true

  # 死亡玩家名的颜色样式（MiniMessage 标签）
  player-name-color: "<yellow>"

  # 击杀者名字的颜色样式
  killer-name-color: "<red>"

  # 死亡音效设置
  death-sound:
    # 是否播放死亡音效
    enabled: true
    # 音效类型（Bukkit Sound 枚举名，常见可选值）：
    #   ENTITY_PLAYER_DEATH        - 原版玩家死亡音
    #   ENTITY_LIGHTNING_BOLT_THUNDER - 雷声
    #   ENTITY_WITHER_DEATH        - 凋灵死亡音
    #   ENTITY_VILLAGER_DEATH      - 村民死亡音
    #   BLOCK_ANVIL_LAND           - 铁砧落地
    #   ENTITY_GHAST_SCREAM        - 恶魂尖叫
    #   完整列表见 Bukkit API 的 org.bukkit.Sound 枚举
    sound: ENTITY_PLAYER_DEATH
    # 音量（0.0 ~ 2.0，越大传播越远）
    volume: 1.0
    # 音调（0.5 ~ 2.0，1.0 为正常，越大音调越高）
    pitch: 1.0
    # 播放对象：
    #   victim   - 仅死亡玩家本人听到
    #   nearby   - 死亡地点附近的玩家听到（范围由 volume 决定）
    #   everyone - 全服所有在线玩家听到
    target: everyone

  # ============ 击杀特效 ============
  # 玩家击杀生物后，在被击杀者的死亡地点触发粒子爆发与音效
  # （击杀者本人与附近玩家可见可听）。仅由玩家造成的击杀才触发。
  kill-effect:
    # 是否启用击杀特效
    enabled: true
    # 仅对敌对生物生效（true）：一切会攻击玩家的敌对生物（僵尸/骷髅/苦力怕/史莱姆/
    # 恶魂/幻翼/猪灵/循声守卫等，含凋灵/末影龙等 Boss，均实现 Bukkit 的 Enemy 接口）；
    # false 则对任意非玩家生物（含牛/羊/铁傀儡等中立与被动生物）生效
    only-hostile: true
    # PVP 击杀（玩家被玩家击杀）是否也触发特效（默认关闭，仅怪物生效）
    include-players: false
    # 是否播放粒子特效
    particle-enabled: true
    # 粒子类型（Bukkit Particle 枚举名，常见可选值）：
    #   POOF  - 小型爆炸烟雾（默认；MC 1.20.5+ 改名，即旧名 EXPLOSION_NORMAL）
    #   CRIT  - 暴击星芒（击杀感强）
    #   ENCHANT - 附魔台魔法粒子
    #   END_ROD - 末地烛光点（明亮）
    #   SOUL_FIRE_FLAME - 灵魂火
    #   WITCH  - 紫色魔法星（MC 1.20.5+ 改名，即旧名 SPELL_WITCH）
    #   FIREWORK - 烟花粒子
    #   留空则不发粒子
    particle: POOF
    # 粒子数量（中心爆发粒子数，越大越密集；特效还会生成一个冲击波圆环）
    particle-amount: 40
    # 粒子初速（0.0 ~ 1.0，越大向四周扩散越猛烈）
    particle-speed: 0.4
    # 是否播放击杀音效
    sound-enabled: true
    # 音效类型（Bukkit Sound 枚举名，常见可选值）：
    #   ENTITY_EXPERIENCE_ORB_PICKUP - 经验球拾取（清脆轻快，默认）
    #   ENTITY_PLAYER_LEVELUP        - 升级音（成就感强）
    #   ENTITY_GENERIC_EXPLODE       - 爆炸声
    #   ENTITY_ZOMBIE_DEATH          - 僵尸死亡
    #   BLOCK_ANVIL_LAND             - 铁砧落地
    #   留空则不播放
    sound: ENTITY_EXPERIENCE_ORB_PICKUP
    # 音量（0.0 ~ 2.0，越大传播越远）与音调（0.5 ~ 2.0，1.0 正常）
    volume: 1.0
    pitch: 1.0

  # ============ 击杀者互动 ============

  # 击杀者专属反馈：PVP 击杀时，通过 actionbar 向击杀者本人展示一条确认消息
  # （对应 messages.killer-feedback 文案池，未配置该分类则不发送）
  killer-feedback:
    # 是否开启击杀者反馈
    enabled: true

  # 连杀称号：击杀者连续击杀达到 2 次及以上时，以 Minecraft 标题（屏幕中央大字）展示称号（广播范围内玩家可见）
  kill-streak:
    # 是否开启连杀播报
    enabled: true
    # 各连杀等级的称号（参考 MOBA 游戏播报风格）。
    # key 为连杀数，超过最高档的连杀沿用最高档称号（如 6 连杀仍显示"五连绝世"）。
    titles:
      "2": "二连击破"
      "3": "三连决胜"
      "4": "四连超凡"
      "5": "五连绝世"
    # 播报模板，可用占位符：{player} {killer} {streak} {title}
    message: " <gold>{killer} <bold><aqua>{title}</aqua></bold>！</gold>"
    # 是否将连杀称号额外以 Minecraft 标题（屏幕中央大字）展示给广播范围内玩家
    show-title: true
    # 主标题（中央大字）模板，可用占位符：{player} {killer} {streak} {title}
    title-main: "<gold><bold>{title}</bold></gold>"
    # 副标题（主标题下方小字）模板，可用占位符：{player} {killer} {streak} {title}
    title-sub: "<red>{killer}</red> <gray>达成 {streak} 连杀</gray>"
    # 标题时长（单位：刻，20 刻 = 1 秒）
    title-fade-in: 10
    title-fade-stay: 70
    title-fade-out: 20

  # 首杀文案：服务器启动后的第一次玩家死亡使用专属文案
  # （对应 messages.first-blood 文案池，未配置该分类则回退正常分类）
  first-blood:
    # 是否启用首杀文案（每次服务器重启后触发一次）
    enabled: true

  # ============ 卷轴（护身 / 回城 / 回溯）============
  # 护身卷轴被动触发（死亡时免掉落），回城/回溯卷轴手持右键使用；物品均以 PDC 标识识别
  scrolls:
    # 施法表现（回城/回溯卷轴读条期间的通用效果）
    cast-effect:
      # 施法期间是否显示物品栏冷却条（类似末影珍珠的冷却动画，时长 = cast-time）
      cooldown-enabled: true
      # 施法期间是否播放传送粒子特效
      particle-enabled: true
      # 粒子类型（Bukkit Particle 枚举名，常见可选值）：
      #   PORTAL              - 传送门紫色粒子（最贴合传送主题）
      #   END_ROD             - 末地烛粒子（明亮小光点）
      #   ENCHANT             - 附魔台魔法粒子
      #   SPELL_WITCH         - 紫色魔法星
      #   SOUL_FIRE_FLAME     - 灵魂火
      #   留空则不发粒子
      particle: PORTAL
      # 每波粒子数量（环绕玩家一圈的数量，越大越密集）
      particle-amount: 20
      # 施法倒计时期间是否播放节拍音效（仅施法者本人可听）
      cast-sound-enabled: true
      # 节拍音效类型（Bukkit Sound 枚举名，常见可选值）：
      #   BLOCK_NOTE_BLOCK_PLING - 音符盒叮声（倒计时感强，默认）
      #   BLOCK_NOTE_BLOCK_HAT   - 轻敲声
      #   UI_BUTTON_CLICK        - 界面点击
      #   ENTITY_EXPERIENCE_ORB_PICKUP - 经验球拾取
      #   留空则不播放
      cast-sound: BLOCK_NOTE_BLOCK_PLING
      # 节拍音效间隔（秒，每隔 N 秒响一次）
      cast-sound-interval: 1
      # 节拍音量（0.0 ~ 2.0）与音调（0.5 ~ 2.0，1.0 正常）
      cast-sound-volume: 1.0
      cast-sound-pitch: 1.0
      # 传送完成（回到目标地点）后是否播放音效（仅施法者本人可听）
      complete-sound-enabled: true
      # 完成音效类型（Bukkit Sound 枚举名，常见可选值）：
      #   ENTITY_ENDERMAN_TELEPORT   - 末影人传送声（传送感最强，默认）
      #   ENTITY_ENDER_EYE_DEATH     - 末影之眼破碎
      #   BLOCK_PORTAL_TRAVEL        - 传送门穿梭
      #   ENTITY_PLAYER_LEVELUP      - 升级音
      #   留空则不播放
      complete-sound: ENTITY_ENDERMAN_TELEPORT
      # 完成音量与音调
      complete-sound-volume: 1.0
      complete-sound-pitch: 1.0
      # 传送完成（回到目标地点）后是否播放"白色环绕"到达粒子特效
      arrive-particle-enabled: true
      # 到达粒子类型（Bukkit Particle 枚举名，常见可选值）：
      #   END_ROD              - 末地烛（白色明亮光点，默认，最贴合"白色环绕"）
      #   WHITE_ASH           - 白色灰烬（柔和飘散感）
      #   SNOWFLAKE          - 雪花
      #   ENCHANT            - 附魔台魔法粒子（偏白+字文）
      #   SPELL_INSTANT      - 白色治疗星爆
      # 留空则不发粒子
      arrive-particle: END_ROD
      # 到达粒子每波数量（环绕一圈的粒子数，越大越密集）
      arrive-particle-amount: 24
      # 到达粒子波数（连续几波，一波比一波高形成上升光晕）
      arrive-particle-waves: 4
      # 相邻两波到达粒子之间的间隔（单位：刻，20 刻 = 1 秒；越小波越密）
      arrive-particle-interval-ticks: 3
    # 护身卷轴：玩家背包（含装备栏与副手）携带时，死亡免于掉落物品与经验，并消耗一张
    # 发放命令：/customdeath scroll protect <玩家> [数量]（需权限 customdeath.scroll）
    protect:
      # 是否启用护身卷轴
      enabled: true
      # 卷轴材质（Bukkit Material 枚举名，如 PAPER / GOLD_NUGGET / TOTEM_OF_UNDYING）
      material: PAPER
      # 卷轴显示名（支持 MiniMessage）
      name: "<yellow><bold>护身卷轴</bold></yellow>"
      # 卷轴描述（每行一条，支持 MiniMessage）
      lore:
        - "<gray>携带此卷轴死亡时</gray>"
        - "<green>免于掉落物品与经验，并消耗一张</green>"
      # 触发时是否同时保留经验等级
      keep-level: true
      # 触发时给玩家的提示消息（支持 MiniMessage，留空则不提示）
      message: "<green><bold>✔</bold> 护身卷轴生效，你免于死亡掉落</green>"
    # 回城卷轴：传送到床（重生点）位置；未设置重生点时不可用
    town:
      # 是否启用回城卷轴
      enabled: true
      # 卷轴材质（Bukkit Material 枚举名）
      material: PAPER
      # 卷轴显示名（支持 MiniMessage）
      name: "<aqua><bold>回城卷轴</bold></aqua>"
      # 卷轴描述（每行一条，支持 MiniMessage）
      lore:
        - "<gray>右键使用</gray>"
        - "<green>传送到你上次睡觉的位置</green>"
      # 使用成功后的提示消息（支持 MiniMessage）
      message: "<aqua>你回到了家中</aqua>"
      # 施法倒计时（单位：秒；0 表示立即传送，不读条）
      # 使用后原地开始倒计时，期间移动（cancel-on-move）会被打断且不消耗卷轴
      cast-time: 5
      # 施法期间移动是否打断施法（打断不消耗卷轴；false 则移动不影响读条）
      cancel-on-move: true
      # 开始施法时的提示（支持 MiniMessage，{time} = 施法总秒数）
      cast-start-message: "<aqua>开始回城，请勿移动（{time} 秒）...</aqua>"
      # 施法被打断时的提示（支持 MiniMessage）
      cast-cancel-message: "<red>移动打断了回城，卷轴未消耗</red>"
      # 倒计时期间 actionbar 提示（支持 MiniMessage，{time} = 剩余秒数）
      countdown-actionbar: "<aqua>回城传送中... {time} 秒</aqua>"
    # 回溯卷轴：传送到最近的死亡点；无死亡点记录时不可用
    recall:
      # 是否启用回溯卷轴
      enabled: true
      # 卷轴材质（Bukkit Material 枚举名）
      material: PAPER
      # 卷轴显示名（支持 MiniMessage）
      name: "<light_purple><bold>回溯卷轴</bold></light_purple>"
      # 卷轴描述（每行一条，支持 MiniMessage）
      lore:
        - "<gray>右键使用</gray>"
        - "<green>传送到最近的死亡地点</green>"
        - "<red>无死亡记录时无法使用</red>"
      # 使用成功后的提示消息（支持 MiniMessage）
      message: "<light_purple>你回到了死亡地点</light_purple>"
      # 施法倒计时（单位：秒；0 表示立即传送，不读条）
      # 使用后原地开始倒计时，期间移动（cancel-on-move）会被打断且不消耗卷轴
      cast-time: 5
      # 施法期间移动是否打断施法（打断不消耗卷轴；false 则移动不影响读条）
      cancel-on-move: true
      # 开始施法时的提示（支持 MiniMessage，{time} = 施法总秒数）
      cast-start-message: "<light_purple>开始回溯，请勿移动（{time} 秒）...</light_purple>"
      # 施法被打断时的提示（支持 MiniMessage）
      cast-cancel-message: "<red>移动打断了回溯，卷轴未消耗</red>"
      # 倒计时期间 actionbar 提示（支持 MiniMessage，{time} = 剩余秒数）
      countdown-actionbar: "<light_purple>回溯传送中... {time} 秒</light_purple>"


# ============================================================
#  死亡消息模板
#  ----------------------------------------------------------
#  每个分类下列出若干条文案，插件会按 message-selection
#  指定的策略（随机/轮流）从中挑选一条进行播报。
#  未在下方配置的分类会使用 default 兜底文案。
# ============================================================
messages:

  # ---------------- 环境伤害 ----------------
  fall:
    - "<red>{player}</red> 从高处跌落，摔成了肉饼"
    - "<gold><bold>{player}</bold></gold> 体验了一把自由落体运动"
    - "<gradient:gold:red>{player}</gradient> 坠楼了，场面惨不忍睹"
    - "<red>{player}</red> 以为自己是猫，结果发现并不会脚着地"
    - "<gold>{player}</gold> 忘记了重力是存在的，付出了生命的代价"
    - "<gradient:red:#ff8800>{player}</gradient> 从悬崖上一跃而下，不是飞行，是坠落"
    - "<red><bold>{player}</bold></red> 玩了一辈子的跑酷，最后一次没跑过去"
    - "<gold>{player}</gold> 试图模仿鸟儿飞翔，可惜没有翅膀"
    - "<gradient:gold:yellow>{player}</gradient> 在高空失足，下落速度越来越快……然后就没有然后了"
    - "<red>{player}</red> 与地面来了个亲密接触，地面赢了"

  fire:
    - "<red>{player}</red> 在火焰中化为了灰烬"
    - "<red><bold>{player}</bold></red> 自焚成功，达成成就：火焰化"

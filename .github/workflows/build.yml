name: build

# 提交代码到 main 分支（或提交 PR）时自动执行 Maven 构建
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # paper-api 1.21.1 的 class 版本为 65（Java 21），必须用 JDK 21 编译
      # （pom.xml 中 maven.compiler.release=17 只影响输出 bytecode 版本）
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: CustomDeathMessages-jar
          path: target/CustomDeathMessages-1.0.0.jar
          if-no-files-found: error
